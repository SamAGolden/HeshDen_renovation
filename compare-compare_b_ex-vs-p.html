const get=()=>{for(const s of stores){try{const v=s().getItem(SK);if(v)return JSON.parse(v)}catch(_){}}return null};
const put=(v,keep)=>{const j=JSON.stringify(v);try{sessionStorage.setItem(SK,j)}catch(_){}if(keep)try{localStorage.setItem(SK,j)}catch(_){}};

async function page(raw,[iv,ct]){const k=await crypto.subtle.importKey("raw",d(raw),"AES-GCM",false,["decrypt"]);
 return await new Response(new Blob([await aes(k,iv,ct)]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
async function signin(name,pw){
