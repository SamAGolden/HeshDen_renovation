async function page(raw,[iv,ct]){const k=await crypto.subtle.importKey("raw",d(raw),"AES-GCM",false,["decrypt"]);
 return await new Response(new Blob([await aes(k,iv,ct)]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
async function signin(name,pw){
 const id=e(new Uint8Array(await crypto.subtle.digest("SHA-256",new Uint8Array([...d(SALT),...new TextEncoder().encode(name.toLowerCase())]))));
 const u=U[id];if(!u)return null;
 const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(u[0]),iterations:ITER,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["decrypt"]);
 try{return JSON.parse(new TextDecoder().decode(await aes(k,u[1],u[2])))}catch(_){return null}}
const render=h=>{document.open();document.write(h);document.close()};
async function show(s){            // true: shown; false: these keys no longer open this page
 const t=TIERS.find(t=>s.k&&s.k[t]&&P[t]);
 if(!t){document.getElementById("x").hidden=false;return true}
 try{render(await page(s.k[t],P[t]));return true}catch(_){return false}}
const f=document.getElementById("f"),m=document.getElementById("e"),b=document.getElementById("b");
const form=msg=>{f.hidden=false;m.textContent=msg||"";document.getElementById("u").focus()};
document.getElementById("o").addEventListener("click",ev=>{ev.preventDefault();drop();location.href="index.html"});
const saved=get();
if(saved)show(saved).then(ok=>{if(!ok){drop();form("Your saved sign-in has expired. Please sign in again.")}});else form();
f.addEventListener("submit",async ev=>{ev.preventDefault();b.disabled=true;m.textContent="Signing in…";
 const s=await signin(document.getElementById("u").value.trim(),document.getElementById("p").value);
 if(!s){m.textContent="Wrong username or password.";b.disabled=false;return}
 drop();put(s,document.getElementById("r").checked);
 if(!await show(s)){drop();m.textContent="This page could not be opened. Try reloading.";b.disabled=false}});
})();
</script></body></html>
